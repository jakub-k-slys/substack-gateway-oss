[project]
name = "gateway_rest_common"
version = "3.3.0"
requires-python = ">=3.11"
dependencies = ["gateway_core", "fastapi>=0.141.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_rest_common"]

[tool.uv.sources]
gateway_core = { workspace = true }
