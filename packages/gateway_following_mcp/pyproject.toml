[project]
name = "gateway_following_mcp"
version = "3.3.0"
requires-python = ">=3.11"
dependencies = ["gateway_core", "gateway_mcp_common", "gateway_following", "fastmcp>=3.4.5"]

[project.entry-points."substack_gateway.capabilities"]
following_mcp = "gateway_following_mcp:capability"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_following_mcp"]

[tool.uv.sources]
gateway_core = { workspace = true }
gateway_mcp_common = { workspace = true }
gateway_following = { workspace = true }
