[project]
name = "gateway_stats"
version = "3.6.0"
requires-python = ">=3.11"
dependencies = ["gateway_core", "pydantic>=2.13.5", "redis>=8.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_stats"]

[tool.uv.sources]
gateway_core = { workspace = true }
