[project]
name = "gateway_drafts_rest"
version = "3.8.0"
requires-python = ">=3.11"
dependencies = [
  "gateway_core",
  "gateway_drafts",
  "gateway_rest_common",
  "fastapi>=0.141.1",
  "python-multipart>=0.0.32",
]

[project.entry-points."substack_gateway.capabilities"]
drafts_rest = "gateway_drafts_rest:capability"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_drafts_rest"]

[tool.uv.sources]
gateway_core = { workspace = true }
gateway_drafts = { workspace = true }
gateway_rest_common = { workspace = true }
