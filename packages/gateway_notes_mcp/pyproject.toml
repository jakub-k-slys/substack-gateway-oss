[project]
name = "gateway_notes_mcp"
version = "3.1.0"
requires-python = ">=3.11"
dependencies = ["gateway_core", "gateway_notes", "gateway_mcp_common", "fastmcp>=3.4.2"]

[project.entry-points."substack_gateway.capabilities"]
notes_mcp = "gateway_notes_mcp:capability"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_notes_mcp"]

[tool.uv.sources]
gateway_core = { workspace = true }
gateway_notes = { workspace = true }
gateway_mcp_common = { workspace = true }
