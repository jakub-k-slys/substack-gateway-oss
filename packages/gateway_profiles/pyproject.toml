[project]
name = "gateway_profiles"
version = "6.1.0"
requires-python = ">=3.11"
dependencies = ["gateway_core", "pydantic>=2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_profiles"]

[tool.uv.sources]
gateway_core = { workspace = true }
