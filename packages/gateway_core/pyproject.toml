[project]
name = "gateway_core"
version = "4.0.1"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "pyrate-limiter>=4.5.0",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "markdownify>=1.2.3",
  "tenacity>=9.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_core"]
