[project]
name = "gateway_core"
version = "5.1.1"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "pyrate-limiter>=4.5.0",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.15.0",
  "markdownify>=1.2.3",
  "tenacity>=9.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_core"]
