[project]
name = "gateway_core"
version = "6.1.1"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "markdownify>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_core"]
