[project]
name = "gateway_core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "pyrate-limiter>=4.4.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "aiocache[redis]>=0.12.3",
  "markdownify>=1.2.3",
  "tenacity>=9.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_core"]
