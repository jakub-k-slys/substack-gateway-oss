[project]
name = "gateway_posts"
version = "5.1.1"
requires-python = ">=3.11"
dependencies = ["gateway_core", "pydantic>=2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_posts"]

[tool.uv.sources]
gateway_core = { workspace = true }
