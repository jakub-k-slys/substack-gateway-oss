[project]
name = "gateway_stats_rest"
version = "3.6.0"
requires-python = ">=3.11"
dependencies = ["gateway_core", "gateway_stats", "gateway_rest_common", "fastapi>=0.141.1"]

[project.entry-points."substack_gateway.capabilities"]
stats_rest = "gateway_stats_rest:capability"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_stats_rest"]

[tool.uv.sources]
gateway_core = { workspace = true }
gateway_stats = { workspace = true }
gateway_rest_common = { workspace = true }
