[project]
name = "gateway_oss"
version = "3.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.138.2",
  "httpx>=0.28.0",
  "pyrate-limiter>=4.4.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "aiocache[redis]>=0.12.3",
  "fastmcp>=3.4.2",
  "markdownify>=1.2.3",
  "tenacity>=9.1.2",
  "uvloop>=0.22.1",
  "gateway_core",
  "gateway_following",
  "gateway_notes",
  "gateway_posts",
  "gateway_notes_rest",
  "gateway_notes_mcp",
  "gateway_following_rest",
  "gateway_following_mcp",
  "gateway_rest_common",
  "gateway_mcp_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_oss"]

[tool.uv.sources]
gateway_core = { workspace = true }
gateway_following = { workspace = true }
gateway_notes = { workspace = true }
gateway_posts = { workspace = true }
gateway_notes_rest = { workspace = true }
gateway_notes_mcp = { workspace = true }
gateway_following_rest = { workspace = true }
gateway_following_mcp = { workspace = true }
gateway_rest_common = { workspace = true }
gateway_mcp_common = { workspace = true }
