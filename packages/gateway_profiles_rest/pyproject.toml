[project]
name = "gateway_profiles_rest"
version = "3.1.0"
requires-python = ">=3.11"
dependencies = [
  "gateway_core",
  "gateway_rest_common",
  "gateway_profiles",
  "gateway_posts",
  "gateway_notes",
  "fastapi>=0.138.2",
]

[project.entry-points."substack_gateway.capabilities"]
profiles_rest = "gateway_profiles_rest:capability"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_profiles_rest"]

[tool.uv.sources]
gateway_core = { workspace = true }
gateway_rest_common = { workspace = true }
gateway_profiles = { workspace = true }
gateway_posts = { workspace = true }
gateway_notes = { workspace = true }
