[project]
name = "gateway_mcp_common"
version = "6.0.0"
requires-python = ">=3.11"
dependencies = ["gateway_core", "fastmcp>=4.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_mcp_common"]

[tool.uv.sources]
gateway_core = { workspace = true }
