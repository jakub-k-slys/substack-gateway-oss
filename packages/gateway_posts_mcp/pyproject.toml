[project]
name = "gateway_posts_mcp"
version = "3.8.0"
requires-python = ">=3.11"
dependencies = ["gateway_core", "gateway_mcp_common", "gateway_posts", "fastmcp>=4.0.2"]

[project.entry-points."substack_gateway.capabilities"]
posts_mcp = "gateway_posts_mcp:capability"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_posts_mcp"]

[tool.uv.sources]
gateway_core = { workspace = true }
gateway_mcp_common = { workspace = true }
gateway_posts = { workspace = true }
