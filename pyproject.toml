[project]
name = "substack-gateway"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "gateway_oss",
  "gateway_core",
  "fastapi>=0.141.1",
  "fastmcp>=3.4.5",
  "starlette",
  "uvicorn>=0.52.0",
  "uvloop>=0.22.1",
]

[project.scripts]
app = "substack_gateway.main:main"
gateway_oss = "substack_gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substack_gateway"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gateway_oss = { workspace = true }
gateway_core = { workspace = true }
gateway_comments = { workspace = true }
gateway_following = { workspace = true }
gateway_notes = { workspace = true }
gateway_posts = { workspace = true }
gateway_profiles = { workspace = true }
gateway_notes_rest = { workspace = true }
gateway_notes_mcp = { workspace = true }
gateway_following_rest = { workspace = true }
gateway_following_mcp = { workspace = true }
gateway_posts_rest = { workspace = true }
gateway_posts_mcp = { workspace = true }
gateway_comments_rest = { workspace = true }
gateway_comments_mcp = { workspace = true }
gateway_profiles_rest = { workspace = true }
gateway_profiles_mcp = { workspace = true }
gateway_me_rest = { workspace = true }
gateway_me_mcp = { workspace = true }
gateway_rest_common = { workspace = true }
gateway_mcp_common = { workspace = true }


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gateway_core", "gateway_comments", "gateway_following", "gateway_notes", "gateway_notes_rest", "gateway_notes_mcp", "gateway_following_rest", "gateway_following_mcp", "gateway_posts", "gateway_posts_rest", "gateway_posts_mcp", "gateway_comments_rest", "gateway_comments_mcp", "gateway_profiles", "gateway_profiles_rest", "gateway_profiles_mcp", "gateway_me_rest", "gateway_me_mcp", "gateway_oss", "gateway_rest_common", "gateway_mcp_common", "substack_gateway"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.behave]
paths = ["packages/gateway_oss/features/"]
show_timings = true
summary = true
default_format = "pretty"

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "packages/gateway_oss/tests",
  "packages/gateway_core/tests",
  "packages/gateway_comments/tests",
  "packages/gateway_following/tests",
  "packages/gateway_notes/tests",
  "packages/gateway_posts/tests",
  "packages/gateway_profiles/tests",
]
addopts = "--import-mode=importlib"


[tool.ty.src]
exclude = ["packages/gateway_oss/features/", "packages/gateway_oss/e2e/"]


[tool.semantic_release]
version_toml = [
  "packages/gateway_oss/pyproject.toml:project.version",
  "packages/gateway_core/pyproject.toml:project.version",
  "packages/gateway_notes/pyproject.toml:project.version",
  "packages/gateway_notes_rest/pyproject.toml:project.version",
  "packages/gateway_notes_mcp/pyproject.toml:project.version",
  "packages/gateway_rest_common/pyproject.toml:project.version",
  "packages/gateway_mcp_common/pyproject.toml:project.version",
  "packages/gateway_following/pyproject.toml:project.version",
  "packages/gateway_following_rest/pyproject.toml:project.version",
  "packages/gateway_following_mcp/pyproject.toml:project.version",
  "packages/gateway_posts/pyproject.toml:project.version",
  "packages/gateway_posts_rest/pyproject.toml:project.version",
  "packages/gateway_posts_mcp/pyproject.toml:project.version",
  "packages/gateway_comments/pyproject.toml:project.version",
  "packages/gateway_comments_rest/pyproject.toml:project.version",
  "packages/gateway_comments_mcp/pyproject.toml:project.version",
  "packages/gateway_profiles/pyproject.toml:project.version",
  "packages/gateway_profiles_rest/pyproject.toml:project.version",
  "packages/gateway_profiles_mcp/pyproject.toml:project.version",
  "packages/gateway_me_rest/pyproject.toml:project.version",
  "packages/gateway_me_mcp/pyproject.toml:project.version",
]
branch = "main"
commit_author = "Jakub Slys <jakub@slys.dev>"
commit_message = "chore(release): {version}"
tag_format = "{version}"


[dependency-groups]
dev = [
  "ruff>=0.15.17",
  "ty>=0.0.65",
  "behave>=1.2.6",
  "respx>=0.23.1",
  "httpx>=0.28.0",
  "pytest>=9.1.1",
]
