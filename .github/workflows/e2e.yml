name: E2E Tests

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Vercel Production
    types:
      - completed

jobs:
  e2e:
    name: E2E
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14" # newest CPython lacks wheels (watchfiles/PyO3); pin until they ship

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run E2E tests (pytest-bdd)
        # pytest-bdd's --cucumberjson does not create the directory itself.
        run: |
          mkdir -p e2e-reports
          uv run pytest packages/gateway_oss/e2e/ -rs --junit-xml=e2e-reports/results.xml --cucumberjson=e2e-reports/cucumber.json
        env:
          SUBSTACK_GATEWAY_BASE_URL: ${{ secrets.SUBSTACK_GATEWAY_BASE_URL }}
          SUBSTACK_GATEWAY_TOKEN: ${{ secrets.SUBSTACK_GATEWAY_TOKEN }}
          SUBSTACK_TOKEN: ${{ secrets.SUBSTACK_TOKEN }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
          E2E_PROFILE_SLUG: ${{ secrets.E2E_PROFILE_SLUG }}
          E2E_NOTE_ID: ${{ secrets.E2E_NOTE_ID }}
          E2E_POST_ID: ${{ secrets.E2E_POST_ID }}

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e-reports/
          if-no-files-found: ignore

      - name: Write test summary
        if: always()
        run: python3 .github/scripts/e2e_report.py summary e2e-reports

      - name: Build Slack summary
        if: always()
        env:
          SLACK_PAYLOAD_PATH: ${{ runner.temp }}/slack-payload.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/e2e_report.py slack e2e-reports

      - name: Send Slack summary
        if: always()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
          errors: true
